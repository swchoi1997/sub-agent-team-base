[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tokenpool"
version = "0.1.0"
description = "팀원끼리 사내 LLM 일일 토큰 한도를 나눠 쓰는 Claude Code용 로컬 프록시"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "starlette>=0.37",
  "uvicorn>=0.29",
  "sqlalchemy>=2.0",
  "cryptography>=42",
  "tzdata; sys_platform == 'win32'",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
mysql = ["pymysql>=1.1"]
test = ["pytest>=8"]

[project.scripts]
tokenpool = "tokenpool.cli:main"

[tool.setuptools]
packages = ["tokenpool"]

[tool.pytest.ini_options]
testpaths = ["tests"]
